syntax = "proto3";
package container_bridge_service.v1;
option go_package = "github.com/helixdevelopment/container-bridge-service/api/proto/container_bridge_service/v1;container_bridge_servicev1";

import "google/protobuf/timestamp.proto";
service ContainerBridgeService {
  rpc ListContainers(ListContainersRequest) returns (ListContainersResponse);
  rpc GetContainer(GetContainerRequest) returns (GetContainerResponse);
  rpc CreateContainer(CreateContainerRequest) returns (CreateContainerResponse);
  rpc UpdateContainer(UpdateContainerRequest) returns (UpdateContainerResponse);
  rpc DeleteContainer(DeleteContainerRequest) returns (DeleteContainerResponse);
  rpc StartContainer(StartContainerRequest) returns (StartContainerResponse);
  rpc StopContainer(StopContainerRequest) returns (StopContainerResponse);
  rpc RestartContainer(RestartContainerRequest) returns (RestartContainerResponse);
  rpc GetContainerLogs(GetContainerLogsRequest) returns (GetContainerLogsResponse);
  rpc GetContainerMetrics(GetContainerMetricsRequest) returns (GetContainerMetricsResponse);
  rpc ExecuteInContainer(ExecuteInContainerRequest) returns (ExecuteInContainerResponse);
  rpc StreamContainerLogs(StreamContainerLogsRequest) returns (stream StreamContainerLogsResponse);
  rpc GetContainerStats(GetContainerStatsRequest) returns (GetContainerStatsResponse);
  rpc GetContainerProcesses(GetContainerProcessesRequest) returns (GetContainerProcessesResponse);
  rpc GetContainerFiles(GetContainerFilesRequest) returns (GetContainerFilesResponse);
  rpc UploadToContainer(stream UploadToContainerRequest) returns (UploadToContainerResponse);
  rpc DownloadFromContainer(DownloadFromContainerRequest) returns (stream DownloadFromContainerResponse);
  rpc GetContainerNetworks(GetContainerNetworksRequest) returns (GetContainerNetworksResponse);
  rpc GetContainerVolumes(GetContainerVolumesRequest) returns (GetContainerVolumesResponse);
  rpc AttachToContainer(AttachToContainerRequest) returns (stream AttachToContainerResponse);
  rpc ResizeContainerTTY(ResizeContainerTTYRequest) returns (ResizeContainerTTYResponse);
  rpc GetContainerEvents(GetContainerEventsRequest) returns (stream GetContainerEventsResponse);
  rpc GetContainerHealth(GetContainerHealthRequest) returns (GetContainerHealthResponse);
  rpc GetContainerDiff(GetContainerDiffRequest) returns (GetContainerDiffResponse);
  rpc CommitContainer(CommitContainerRequest) returns (CommitContainerResponse);
  rpc GetContainerImages(GetContainerImagesRequest) returns (GetContainerImagesResponse);
  rpc DeleteContainerImage(DeleteContainerImageRequest) returns (DeleteContainerImageResponse);
  rpc BuildContainerImage(stream BuildContainerImageRequest) returns (stream BuildContainerImageResponse);
  rpc GetContainerRegistries(GetContainerRegistriesRequest) returns (GetContainerRegistriesResponse);
  rpc PullContainerImage(PullContainerImageRequest) returns (stream PullContainerImageResponse);
  rpc PushContainerImage(PushContainerImageRequest) returns (stream PushContainerImageResponse);
  rpc GetContainerComposeProjects(GetContainerComposeProjectsRequest) returns (GetContainerComposeProjectsResponse);
  rpc DeployComposeProject(DeployComposeProjectRequest) returns (DeployComposeProjectResponse);
  rpc GetContainerComposeProject(GetContainerComposeProjectRequest) returns (GetContainerComposeProjectResponse);
  rpc DeleteComposeProject(DeleteComposeProjectRequest) returns (DeleteComposeProjectResponse);
}

message Container {
  string id = 1;
  string name = 2;
  string image = 3;
  string status = 4;
  string state = 5;
  repeated string labels = 6;
  repeated string ports = 7;
  repeated string volumes = 8;
  repeated string networks = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp started_at = 11;
  google.protobuf.Timestamp finished_at = 12;
  string exit_code = 13;
  string host_id = 14;
  string organization_id = 15;
  map<string, string> metadata = 16;
}

message ContainerMetrics {
  string id = 1;
  float cpu_percent = 2;
  float memory_percent = 3;
  int64 memory_usage_bytes = 4;
  int64 memory_limit_bytes = 5;
  int64 network_rx_bytes = 6;
  int64 network_tx_bytes = 7;
  int64 block_read_bytes = 8;
  int64 block_write_bytes = 9;
  int32 pids = 10;
  google.protobuf.Timestamp collected_at = 11;
}

message ContainerStats {
  string id = 1;
  int64 total_cpu_usage = 2;
  int64 total_memory_usage = 3;
  int64 total_network_rx = 4;
  int64 total_network_tx = 5;
  google.protobuf.Timestamp collected_at = 6;
}

message ContainerProcess {
  int32 pid = 1;
  string user = 2;
  float cpu_percent = 3;
  float memory_percent = 4;
  string command = 5;
  string start_time = 6;
}

message ContainerProcesses {
  string id = 1;
  repeated ContainerProcess processes = 2;
}

message ContainerFile {
  string path = 1;
  string name = 2;
  int64 size = 3;
  string type = 4;
  string permissions = 5;
  google.protobuf.Timestamp modified_at = 6;
}

message ContainerFiles {
  string id = 1;
  repeated ContainerFile files = 2;
}

message FileInfo {
  string path = 1;
  string name = 2;
  int64 size = 3;
  string type = 4;
  google.protobuf.Timestamp modified_at = 5;
}

message ContainerLogEntry {
  string id = 1;
  string stdout = 2;
  string stderr = 3;
  google.protobuf.Timestamp timestamp = 4;
}

message ContainerLogStream {
  string id = 1;
  repeated ContainerLogEntry entries = 2;
}

message ContainerOutput {
  string id = 1;
  string data = 2;
  string type = 3;
  google.protobuf.Timestamp timestamp = 4;
}

message ContainerEvent {
  string id = 1;
  string type = 2;
  string action = 3;
  map<string, string> attributes = 4;
  google.protobuf.Timestamp timestamp = 5;
}

message ContainerHealth {
  string id = 1;
  string status = 2;
  int32 failing_streak = 3;
  google.protobuf.Timestamp last_check = 4;
  string log = 5;
}

message ContainerDiff {
  string id = 1;
  repeated ContainerDiffEntry changes = 2;
}

message ContainerDiffEntry {
  string path = 1;
  string type = 2;
  int64 size = 3;
}

message ContainerImage {
  string id = 1;
  string name = 2;
  string tag = 3;
  int64 size = 4;
  google.protobuf.Timestamp created_at = 5;
  map<string, string> labels = 6;
}

message ListContainerImagesResponse {
  repeated ContainerImage images = 1;
}

message BuildProgress {
  string id = 1;
  string status = 2;
  string stream = 3;
  string error = 4;
  int32 progress = 5;
}

message ContainerRegistry {
  string name = 1;
  string url = 2;
  bool authenticated = 3;
}

message ContainerRegistries {
  repeated ContainerRegistry registries = 1;
}

message PullProgress {
  string id = 1;
  string status = 2;
  string progress = 3;
  string error = 4;
}

message PushProgress {
  string id = 1;
  string status = 2;
  string progress = 3;
  string error = 4;
}

message ComposeProject {
  string id = 1;
  string name = 2;
  string status = 3;
  repeated Container services = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message ListContainerComposeProjectsResponse {
  repeated ComposeProject projects = 1;
}

message ExecutionResult {
  string id = 1;
  string stdout = 2;
  string stderr = 3;
  int32 exit_code = 4;
  int64 execution_time_ms = 5;
  google.protobuf.Timestamp executed_at = 6;
}

