syntax = "proto3";
package gateway_service.v1;
option go_package = "github.com/helixdevelopment/gateway-service/api/proto/gateway_service/v1;gateway_servicev1";

import "google/protobuf/timestamp.proto";
service GatewayService {
  rpc GetGatewayConfig(GetGatewayConfigRequest) returns (GetGatewayConfigResponse);
  rpc UpdateGatewayConfig(UpdateGatewayConfigRequest) returns (UpdateGatewayConfigResponse);
  rpc GetRoutes(GetRoutesRequest) returns (GetRoutesResponse);
  rpc CreateRoute(CreateRouteRequest) returns (CreateRouteResponse);
  rpc UpdateRoute(UpdateRouteRequest) returns (UpdateRouteResponse);
  rpc DeleteRoute(DeleteRouteRequest) returns (DeleteRouteResponse);
  rpc GetRateLimits(GetRateLimitsRequest) returns (GetRateLimitsResponse);
  rpc UpdateRateLimits(UpdateRateLimitsRequest) returns (UpdateRateLimitsResponse);
  rpc GetAuthenticationPolicies(GetAuthenticationPoliciesRequest) returns (GetAuthenticationPoliciesResponse);
  rpc UpdateAuthenticationPolicies(UpdateAuthenticationPoliciesRequest) returns (UpdateAuthenticationPoliciesResponse);
  rpc GetCORSConfig(GetCORSConfigRequest) returns (GetCORSConfigResponse);
  rpc UpdateCORSConfig(UpdateCORSConfigRequest) returns (UpdateCORSConfigResponse);
  rpc GetSSLConfig(GetSSLConfigRequest) returns (GetSSLConfigResponse);
  rpc UpdateSSLConfig(UpdateSSLConfigRequest) returns (UpdateSSLConfigResponse);
  rpc GetLoadBalancerConfig(GetLoadBalancerConfigRequest) returns (GetLoadBalancerConfigResponse);
  rpc UpdateLoadBalancerConfig(UpdateLoadBalancerConfigRequest) returns (UpdateLoadBalancerConfigResponse);
  rpc GetCacheConfig(GetCacheConfigRequest) returns (GetCacheConfigResponse);
  rpc UpdateCacheConfig(UpdateCacheConfigRequest) returns (UpdateCacheConfigResponse);
  rpc GetCircuitBreakerConfig(GetCircuitBreakerConfigRequest) returns (GetCircuitBreakerConfigResponse);
  rpc UpdateCircuitBreakerConfig(UpdateCircuitBreakerConfigRequest) returns (UpdateCircuitBreakerConfigResponse);
  rpc GetRetryConfig(GetRetryConfigRequest) returns (GetRetryConfigResponse);
  rpc UpdateRetryConfig(UpdateRetryConfigRequest) returns (UpdateRetryConfigResponse);
  rpc GetTimeoutConfig(GetTimeoutConfigRequest) returns (GetTimeoutConfigResponse);
  rpc UpdateTimeoutConfig(UpdateTimeoutConfigRequest) returns (UpdateTimeoutConfigResponse);
  rpc GetLoggingConfig(GetLoggingConfigRequest) returns (GetLoggingConfigResponse);
  rpc UpdateLoggingConfig(UpdateLoggingConfigRequest) returns (UpdateLoggingConfigResponse);
  rpc GetMetricsConfig(GetMetricsConfigRequest) returns (GetMetricsConfigResponse);
  rpc UpdateMetricsConfig(UpdateMetricsConfigRequest) returns (UpdateMetricsConfigResponse);
  rpc GetTracingConfig(GetTracingConfigRequest) returns (GetTracingConfigResponse);
  rpc UpdateTracingConfig(UpdateTracingConfigRequest) returns (UpdateTracingConfigResponse);
  rpc GetWebSocketConfig(GetWebSocketConfigRequest) returns (GetWebSocketConfigResponse);
  rpc UpdateWebSocketConfig(UpdateWebSocketConfigRequest) returns (UpdateWebSocketConfigResponse);
  rpc GetIPWhitelist(GetIPWhitelistRequest) returns (GetIPWhitelistResponse);
  rpc UpdateIPWhitelist(UpdateIPWhitelistRequest) returns (UpdateIPWhitelistResponse);
  rpc GetIPBlacklist(GetIPBlacklistRequest) returns (GetIPBlacklistResponse);
  rpc UpdateIPBlacklist(UpdateIPBlacklistRequest) returns (UpdateIPBlacklistResponse);
  rpc GetGatewayMetrics(GetGatewayMetricsRequest) returns (GetGatewayMetricsResponse);
  rpc GetGatewayLogs(GetGatewayLogsRequest) returns (GetGatewayLogsResponse);
  rpc StreamGatewayLogs(StreamGatewayLogsRequest) returns (stream StreamGatewayLogsResponse);
  rpc GetGatewayHealth(GetGatewayHealthRequest) returns (GetGatewayHealthResponse);
  rpc ReloadGateway(ReloadGatewayRequest) returns (ReloadGatewayResponse);
  rpc GetGatewayVersion(GetGatewayVersionRequest) returns (GetGatewayVersionResponse);
  rpc GetGatewayStatus(GetGatewayStatusRequest) returns (GetGatewayStatusResponse);
  rpc GetGatewayTopology(GetGatewayTopologyRequest) returns (GetGatewayTopologyResponse);
  rpc ValidateGatewayConfig(ValidateGatewayConfigRequest) returns (ValidateGatewayConfigResponse);
  rpc GetGatewayAuditLog(GetGatewayAuditLogRequest) returns (GetGatewayAuditLogResponse);
  rpc GetGatewayAlerts(GetGatewayAlertsRequest) returns (GetGatewayAlertsResponse);
  rpc CreateGatewayAlert(CreateGatewayAlertRequest) returns (CreateGatewayAlertResponse);
  rpc UpdateGatewayAlert(UpdateGatewayAlertRequest) returns (UpdateGatewayAlertResponse);
  rpc DeleteGatewayAlert(DeleteGatewayAlertRequest) returns (DeleteGatewayAlertResponse);
  rpc GetGatewayBackups(GetGatewayBackupsRequest) returns (GetGatewayBackupsResponse);
  rpc CreateGatewayBackup(CreateGatewayBackupRequest) returns (CreateGatewayBackupResponse);
  rpc RestoreGatewayBackup(RestoreGatewayBackupRequest) returns (RestoreGatewayBackupResponse);
  rpc GetGatewayPlugins(GetGatewayPluginsRequest) returns (GetGatewayPluginsResponse);
  rpc InstallGatewayPlugin(InstallGatewayPluginRequest) returns (InstallGatewayPluginResponse);
  rpc UninstallGatewayPlugin(UninstallGatewayPluginRequest) returns (UninstallGatewayPluginResponse);
  rpc EnableGatewayPlugin(EnableGatewayPluginRequest) returns (EnableGatewayPluginResponse);
  rpc DisableGatewayPlugin(DisableGatewayPluginRequest) returns (DisableGatewayPluginResponse);
}

message GatewayConfig {
  string version = 1;
  string environment = 2;
  bool debug_mode = 3;
  map<string, string> metadata = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message Route {
  string id = 1;
  string path = 2;
  string method = 3;
  string service = 4;
  string target_url = 5;
  repeated string middleware = 6;
  bool enabled = 7;
  int32 priority = 8;
  map<string, string> metadata = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message Routes {
  repeated Route routes = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message RateLimit {
  string id = 1;
  string route_id = 2;
  string client_type = 3;
  int32 requests_per_second = 4;
  int32 burst_size = 5;
  string strategy = 6;
  bool enabled = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message RateLimits {
  repeated RateLimit rate_limits = 1;
}

message AuthenticationPolicy {
  string id = 1;
  string name = 2;
  string type = 3;
  string config = 4;
  repeated string routes = 5;
  bool enabled = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message AuthenticationPolicies {
  repeated AuthenticationPolicy policies = 1;
}

message CORSConfig {
  bool enabled = 1;
  repeated string allowed_origins = 2;
  repeated string allowed_methods = 3;
  repeated string allowed_headers = 4;
  bool allow_credentials = 5;
  int32 max_age = 6;
  repeated string exposed_headers = 7;
}

message SSLConfig {
  bool enabled = 1;
  string certificate_path = 2;
  string key_path = 3;
  string ca_path = 4;
  bool verify_client = 5;
  repeated string protocols = 6;
  repeated string ciphers = 7;
  int32 session_timeout = 8;
}

message LoadBalancerConfig {
  string strategy = 1;
  int32 health_check_interval = 2;
  int32 health_check_timeout = 3;
  repeated string health_check_endpoints = 4;
  map<string, string> metadata = 5;
}

message CacheConfig {
  bool enabled = 1;
  int32 default_ttl = 2;
  int32 max_size_mb = 3;
  string eviction_policy = 4;
  repeated string cacheable_routes = 5;
  map<string, string> metadata = 6;
}

