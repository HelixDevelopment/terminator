  string type = 4;
  string permissions = 5;
  string owner = 6;
  string group = 7;
  google.protobuf.Timestamp modified_at = 8;
  google.protobuf.Timestamp created_at = 9;
  string checksum = 10;
}

message CreateDirectoryResponse {

  string path = 1;
  string name = 2;
  int64 size = 3;
  string type = 4;
  string permissions = 5;
  string owner = 6;
  string group = 7;
  google.protobuf.Timestamp modified_at = 8;
  google.protobuf.Timestamp created_at = 9;
  string checksum = 10;
}

message DeleteDirectoryResponse {

}

message GetFileInfoResponse {

  string path = 1;
  string name = 2;
  int64 size = 3;
  string type = 4;
  string permissions = 5;
  string owner = 6;
  string group = 7;
  google.protobuf.Timestamp modified_at = 8;
  google.protobuf.Timestamp created_at = 9;
  string checksum = 10;
}

message SetFilePermissionsResponse {

  string path = 1;
  string name = 2;
  int64 size = 3;
  string type = 4;
  string permissions = 5;
  string owner = 6;
  string group = 7;
  google.protobuf.Timestamp modified_at = 8;
  google.protobuf.Timestamp created_at = 9;
  string checksum = 10;
}

message SetFileOwnerResponse {

  string path = 1;
  string name = 2;
  int64 size = 3;
  string type = 4;
  string permissions = 5;
  string owner = 6;
  string group = 7;
  google.protobuf.Timestamp modified_at = 8;
  google.protobuf.Timestamp created_at = 9;
  string checksum = 10;
}

message GetDiskUsageResponse {

  string path = 1;
  int64 total_bytes = 2;
  int64 used_bytes = 3;
  int64 free_bytes = 4;
  float usage_percent = 5;
}

message CompressFilesResponse {

  string path = 1;
  string name = 2;
  int64 size = 3;
  string type = 4;
  string permissions = 5;
  string owner = 6;
  string group = 7;
  google.protobuf.Timestamp modified_at = 8;
  google.protobuf.Timestamp created_at = 9;
  string checksum = 10;
}

message ExtractArchiveResponse {

  string path = 1;
  string name = 2;
  int64 size = 3;
  string type = 4;
  string permissions = 5;
  string owner = 6;
  string group = 7;
  google.protobuf.Timestamp modified_at = 8;
  google.protobuf.Timestamp created_at = 9;
  string checksum = 10;
}

message CalculateChecksumResponse {

  string path = 1;
  string algorithm = 2;
  string checksum = 3;
}

message GetFilePreviewResponse {

  string path = 1;
  string content_type = 2;
  bytes preview_data = 3;
  int64 total_size = 4;
  int32 preview_lines = 5;
}

message CompareFilesResponse {

  bool identical = 1;
  int64 differences_count = 2;
  repeated FileDiff diffs = 3;
}

message GetTransferStatusResponse {

  string id = 1;
  string status = 2;
  int64 total_bytes = 3;
  int64 transferred_bytes = 4;
  float percent_complete = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp completed_at = 7;
