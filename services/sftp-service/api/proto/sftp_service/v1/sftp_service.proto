}

message CancelTransferResponse {

}
message UploadFileResponse {

  string session_id = 1;
  string path = 2;
  bool recursive = 3;
  string filter = 4;

}

message GetFileInfoRequest {

  string session_id = 1;
  string path = 2;
  string permissions = 3;
  bool recursive = 4;

}

message SearchFilesResponse {

  string session_id = 1;
